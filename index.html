<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="description" content="PersonaForge AI simulates customer behaviour so founders can validate business decisions before launch." />
    <title>PersonaForge AI — Simulate the future</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root{--bg:#030303;--violet:#6c63ff;--teal:#5eead4;--white:#f8f8f8;--muted:#8d8d96}
      *{box-sizing:border-box}
      html,body{height:100%}
      body{margin:0;background:radial-gradient(ellipse 55% 42% at 50% 50%,rgba(108,99,255,.14),transparent 72%),var(--bg);color:var(--white);font-family:'Space Grotesk',sans-serif;overflow:hidden;display:grid;place-items:center}
      .wrap{position:relative;width:min(340px,82vw);text-align:center}
      .mark{position:relative;width:64px;height:64px;margin:0 auto 30px}
      .ring{position:absolute;inset:0;border:1px solid rgba(94,234,212,.45);border-radius:50%;box-shadow:0 0 32px rgba(94,234,212,.35);animation:spin 1.8s linear infinite}
      .ring:before{content:'';position:absolute;top:-3px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--teal);box-shadow:0 0 12px var(--teal)}
      .dot{position:absolute;inset:24px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--teal));opacity:.95}
      @keyframes spin{to{transform:rotate(360deg)}}
      .logo{font:600 clamp(34px,9vw,46px) 'Space Grotesk';letter-spacing:-2px;opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) .1s both}
      .logo i{font-style:normal;background:linear-gradient(90deg,var(--violet),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
      .logo sup{font-size:.4em;vertical-align:super;letter-spacing:2px;color:var(--teal)}
      .tag{font:400 11px 'DM Mono';letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin-top:10px;opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) .28s both}
      .bar{height:2px;background:#1c1c1f;margin:42px 0 16px;overflow:hidden;border-radius:2px}
      .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--violet),var(--teal));box-shadow:0 0 14px rgba(108,99,255,.7);border-radius:2px}
      .row{display:flex;justify-content:space-between;align-items:center;font:400 10px 'DM Mono';letter-spacing:1.5px;color:var(--muted)}
      .pct{color:var(--teal)}
      .boot{margin-top:34px;height:14px;font:400 10px 'DM Mono';letter-spacing:1.5px;color:#5b5b63;opacity:0;animation:rise .6s ease .45s both}
      .boot b{color:var(--teal);font-weight:500}
      @keyframes rise{from{opacity:0;transform:translateY(16px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
      .fade{transition:opacity .55s ease,visibility .55s ease;opacity:0;visibility:hidden}
      .glow{position:fixed;inset:0;pointer-events:none;opacity:.5;background:radial-gradient(ellipse 30% 22% at 50% 46%,rgba(94,234,212,.09),transparent 70%)}
      .video{position:fixed;inset:0;width:100vw;height:100vh;object-fit:cover;background:#000;z-index:2}
    </style>
  </head>
  <body>
    <video id="video" class="video" autoplay muted playsinline src="/assets/splash.mp4"></video>
    <div class="glow"></div>
    <div class="wrap" id="wrap">
      <div class="mark"><i class="dot"></i><i class="ring"></i></div>
      <div class="logo">persona<i>forge</i><sup>AI</sup></div>
      <div class="tag">Simulate the future</div>
      <div class="bar"><i id="fill"></i></div>
      <div class="row"><span>CALIBRATING CUSTOMER UNIVERSE</span><span class="pct" id="pct">0%</span></div>
      <div class="boot" id="boot">Spawning behaviour engines</div>
    </div>
    <script>
      (()=>{
        const go=()=>{document.getElementById('video').classList.add('fade');document.getElementById('wrap').classList.add('fade');setTimeout(()=>location.replace('/persona.html'),520)};
        const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
        const video=document.getElementById('video');
        let ran=false;
        const finish=()=>{if(ran)return;ran=true;go()};
        video.addEventListener('ended',finish);
        video.addEventListener('error',runLoader);
        video.addEventListener('stalled',()=>{});
        const p=video.play();
        if(p&&p.catch)p.catch(()=>{if(!reduce)runLoader()});
        setTimeout(()=>{if(!video.ended&&video.currentTime===0&&video.networkState!==2)runLoader()},4000);
        function runLoader(){if(video.dataset.fall)return;video.dataset.fall=1;video.style.display='none';const fill=document.getElementById('fill'),pct=document.getElementById('pct'),boot=document.getElementById('boot');const lines=['Spawning behaviour engines','Generating 12,480 customer personas','Running purchase simulations','Assembling decision signals','Rendering the universe'];let n=0,li=0;if(!reduce){setInterval(()=>{boot.innerHTML=lines[li++%lines.length]+'<b>…</b>'},520)}const total=reduce?10:2150,start=performance.now();const timer=setInterval(()=>{const t=Math.min(1,(performance.now()-start)/total);const eased=t===1?100:Math.round((1-Math.pow(1-t,3))*100);if(eased>n){n=eased;fill.style.width=n+'%';pct.textContent=n+'%'}if(t===1){clearInterval(timer);setTimeout(()=>{go();},260)}},40)}
      })();
    </script>
  </body>
</html>
