workspace:()=>`<section class="view welcome"><div><div class="label">GOOD MORNING, ALEX</div><h1 style="margin-top:18px">Welcome back,<br>Founder.</h1><p class="sub">One decision can save months of development. Your customer universe is ready whenever you are.</p><button class="button primary" onclick="go('upload')">Start validation &nbsp; →</button><div class="metrics"><div class="metric"><span>ACTIVE PERSONAS</span><b>12,480</b></div><div class="metric"><span>SIMULATIONS RUN</span><b>18</b></div><div class="metric"><span>IDEAS VALIDATED</span><b>04</b></div><div class="metric"><span>LAST SIGNAL</span><b style="color:#5eead4">93</b></div></div></div><div class="orbital"><div class="orbit"></div><div class="orbit" style="width:220px;height:330px;animation-direction:reverse"></div><div class="core"></div></div></section>`,
upload:()=>`<section class="view"><div class="label">NEW VALIDATION</div><h1 style="margin-top:16px">Give your idea a universe.</h1><p class="sub">Upload what you have. PersonaForge will find the signals hiding inside it.</p><div class="upload-grid"><div class="panel"><div class="drop" onclick="pickFiles()"><div><div class="plus">+</div><b id="drop-title">Drop your product material here</b><p id="drop-sub">Landing page · Pitch deck · Product screenshot · Product brief</p><input type="file" id="file-input" multiple accept=".pdf,.png,.jpg,.jpeg,.webp,.txt,.doc,.docx,image/*,application/pdf" style="display:none" onchange="handleFiles(this)"><button class="button" onclick="event.stopPropagation();pickFiles()">Browse files</button></div></div><div class="formrow"><div class="field">Product name &nbsp; <input id="in-name" value="${product.name}"></div><div class="field">Target audience &nbsp; <input id="in-audience" value="${product.audience}"></div><div class="field">Price point &nbsp; <input id="in-price" value="${product.price}"></div><div class="field">Category &nbsp; <input id="in-category" value="${product.category}"></div></div><button class="button violet" style="margin-top:18px" onclick="startValidation()">Start AI validation →</button></div><aside class="panel"><div class="label">VALIDATION CHECKLIST</div><div class="circle">83%</div><div class="check"><i>✓</i> Product name</div><div class="check"><i>✓</i> Pricing</div><div class="check"><i>✓</i> Audience</div><div class="check"><i>✓</i> Description</div><div class="check"><i>✓</i> Screenshot</div><p style="text-align:center;color:#5eead4;font-size:10px;margin-top:21px">READY FOR AI ANALYSIS</p></aside></div></section>`,
processing:()=>`<section class="view process"><div><div class="label">PERSONAFORGE ENGINE / V4.2</div><h1 style="margin-top:16px">Building your customer universe.</h1><p class="sub" style="margin:auto">Thousands of independent behaviour models are now evaluating your product.</p><div class="network">${'<i class="node"></i>'.repeat(6)}</div><div class="progressline"><i id="pline"></i></div><div class="processlog" id="logs"></div></div></section>`,
personas:()=>`<section class="view"><div class="label">${pool.length.toLocaleString()} GENERATED PERSONAS</div><h1 style="margin-top:15px">Meet your future customers.</h1><p class="sub">Every profile is a complete behavioural model, ready to interrogate your assumptions.</p><div class="toolbar"><input class="search" placeholder="Search a persona..." oninput="filterPeople(this.value)"><span class="filter">Age ⌄</span><span class="filter">Profession ⌄</span><span class="filter">Income ⌄</span></div><div class="personas" id="people">${people(pool)}</div></section>`,
simulation:()=>`<section class="view"><div class="label">LIVE PURCHASE SIMULATION</div><h1 style="margin-top:15px">Listen to the room.</h1><p class="sub">Your personas are independently forming opinions about ${product.name}.</p><div class="sim"><div class="simcol"><div class="label">UPLOADED PRODUCT</div><div class="prod"><div class="prodimg"></div><b>${product.name}</b><p style="color:#999;font-size:10px;line-height:1.6">${product.category} for ${product.audience.toLowerCase()}.</p></div></div><div class="simcol"><div class="label">CONVERSATION TIMELINE</div><div class="chat" id="chat"><div class="msg">I think ${product.price} is expensive. <i>Concern · 71%</i></div><div class="msg">I would definitely buy this. <i>Positive · 92%</i></div><div class="msg neg">Needs offline support. <i>Negative · 67%</i></div></div></div><div class="simcol"><div class="label">LIVE CONSENSUS</div><div class="counter">Messages analysed <b id="messages">1,284</b></div><div class="counter">Decision score <b style="color:#5eead4">78 / 100</b></div><div class="counter">Positive sentiment <b style="color:#22c55e">64%</b></div><div class="counter">Still deciding <b style="color:#facc15">21%</b></div><div class="counter">Rejecting <b style="color:#ef7777">15%</b></div></div></div></section>`,
dashboard:()=>`<section class="view"><div class="label">PRODUCT INTELLIGENCE</div><h1 style="margin-top:15px">A clear signal through the noise.</h1><p class="sub">PersonaForge has distilled 12,480 independent decisions into your next best moves.</p><div class="dash"><div class="panel chartbox"><div class="label">VALIDATION SCORE</div><div class="score">93<i>/100</i></div><span style="color:#5eead4;font-size:10px">↑ 14 points above category benchmark</span></div><div class="panel chartbox"><div class="label">PURCHASE LIKELIHOOD</div><div class="ring"></div><div class="label" style="text-align:center;color:#5eead4">78% LIKELY TO BUY</div></div><div class="panel chartbox"><div class="label">FEATURE DEMAND</div><div class="bars"><i style="--h:45%"></i><i style="--h:78%"></i><i style="--h:61%"></i><i style="--h:93%"></i><i style="--h:70%"></i><i style="--h:84%"></i></div></div></div><div class="dash" style="grid-template-columns:1fr 1fr"><div class="panel"><div class="label">PRICING ACCEPTANCE</div><div class="bars"><i style="--h:30%"></i><i style="--h:56%"></i><i style="--h:91%;background:#5eead4"></i><i style="--h:60%"></i><i style="--h:25%"></i></div></div><div class="panel"><div class="label">CUSTOMER SEGMENTS</div><div class="counter">Premium buyers <b>34%</b></div><div class="counter">Value seekers <b>29%</b></div><div class="counter">Early adopters <b>23%</b></div><div class="counter">Risk aware <b>14%</b></div></div></div></section>`,
recommendations:()=>`<section class="view"><div class="label">PRIORITISED ACTIONS</div><h1 style="margin-top:15px">What the universe<br>recommends next.</h1><p class="sub">Each action is ranked by its expected effect on customer behaviour.</p><div class="recgrid"><article class="panel rec"><span class="tag">CRITICAL · HIGH IMPACT</span><h3>Lead with privacy.</h3><p>Trust is the strongest barrier to first purchase. Make security visible above the fold.</p><div class="label" style="color:#5eead4">+18% EXPECTED CONVERSION</div><div class="buttons"><button class="button primary" onclick="toast()">Accept</button><button class="button">Compare</button></div></article><article class="panel rec"><span class="tag">HIGH · MEDIUM EFFORT</span><h3>Reframe the price.</h3><p>Anchor the plan against the three tools it replaces, not a single dashboard.</p><div class="label" style="color:#5eead4">+11% PRICE ACCEPTANCE</div><div class="buttons"><button class="button primary" onclick="toast()">Accept</button><button class="button">Ignore</button></div></article><article class="panel rec"><span class="tag">HIGH · QUICK WIN</span><h3>Show the first win.</h3><p>Let visitors receive their first useful insight within sixty seconds of arriving.</p><div class="label" style="color:#5eead4">+23% TRIAL ACTIVATION</div><div class="buttons"><button class="button primary" onclick="toast()">Accept</button><button class="button">Compare</button></div></article></div></section>`,
report:()=>`<section class="view report"><div class="label">FINAL VALIDATION REPORT · JULY 2026</div><div class="reporthero"><h1>${product.name} is ready<br>to be believed in.</h1><p class="sub">The product has strong market pull with clear opportunities to reduce perceived risk at the moment of purchase.</p><div class="score">93<i>/100</i></div><div class="label" style="color:#5eead4">LAUNCH READINESS: HIGH</div></div><div class="reportsec"><h3>Executive summary</h3><p>${product.name} resonates strongly with independent professionals who value clarity over complexity. The product's strongest advantage is the time it gives back to its users.</p></div><div class="reportsec"><h3>Strengths</h3><p>Clear problem-solution fit<br>Strong premium buyer appeal<br>High perceived product usefulness</p></div><div class="reportsec"><h3>Key objections</h3><p>Privacy assurance needs visibility<br>Price requires stronger value framing<br>Offline access requested by mobile-first personas</p></div><div class="reportsec"><h3>Pricing recommendation</h3><p><b style="color:#5eead4;font-size:18px">${product.price}</b><br>Keep the core price. Position ${product.name} as a replacement for multiple financial tools.</p></div><div style="display:flex;gap:10px;margin-top:28px"><button class="button primary" onclick="toast('Report download prepared.')">Download PDF</button><button class="button" onclick="toast('Share link copied.')">Share report</button><button class="button violet" onclick="go('upload')">Run again</button></div></section>`
};
function people(list){return list.map((p,i)=>`<article class="persona" onclick="openPerson(${i})"><div class="ava" style="filter:hue-rotate(${i*37}deg)"></div><b>${p[0]}</b><small>${p[1]} · ${p[2]}</small><span class="tag">${p[5]}</span><div class="prob"><span>Purchase probability</span><b>${p[3]}%</b></div></article>`).join('')}
function go(p){current=p;crumb.textContent=p.toUpperCase();root.innerHTML=pages[p]();document.querySelectorAll('.navbtn[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));if(p==='processing')startProcess();if(p==='simulation')startChat();scrollTo({top:0,behavior:'smooth'})}
function filterPeople(q){let el=document.querySelector('#people');if(el)el.innerHTML=people(pool.filter(p=>p.join(' ').toLowerCase().includes(q.toLowerCase())))}
function openPerson(i){let p=pool[i];document.querySelector('#modal').innerHTML=`<div class="modalbox"><button class="button" style="float:right" onclick="closeModal()">Close</button><div class="ava"></div><h2>${p[0]}</h2><p class="sub">${p[1]} · ${p[2]} · ${p[4]} income</p><div class="modalgrid"><div><b>Biography</b>Independent, digitally fluent, and protective of their time.</div><div><b>Primary goal</b>Feel calm and in control of every financial decision.</div><div><b>Buying trigger</b>A tangible result in the first minute of use.</div><div><b>Expected objection</b>${p[6]}</div><div><b>Behaviour</b>${p[5]}</div><div><b>Decision confidence</b><span style="color:#5eead4;font-size:20px">${p[3]}%</span></div></div></div>`;document.querySelector('#modal').classList.add('show')}
function closeModal(){document.querySelector('#modal').classList.remove('show')}
function toast(t='Recommendation accepted — simulation updated.'){let x=document.querySelector('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2600)}
function pickFiles(){const el=document.querySelector('#file-input');if(el)el.click()}
function handleFiles(input){const files=Array.from(input.files||[]);product.files=files;const t=document.querySelector('#drop-title'),s=document.querySelector('#drop-sub');if(files.length){t.textContent=files.length===1?files[0].name:files.length+' files selected';s.textContent=files.map(f=>f.name).join(' · ')}else{t.textContent='Drop your product material here';s.textContent='Landing page · Pitch deck · Product screenshot · Product brief'}}
function val(id){const el=document.getElementById(id);return el?el.value.trim():''}
function startValidation(){product.name=val('in-name')||product.name;product.audience=val('in-audience')||product.audience;product.price=val('in-price')||product.price;product.category=val('in-category')||product.category;go('processing')}
function startProcess(){const logs=['Initialising AI agents...','Generating customer personas...','Creating behaviour models...','Running purchase simulation...','Analysing emotional response...','Evaluating pricing...','Comparing competitors...','Building insights...'];let i=0;const box=document.querySelector('#logs'),line=document.querySelector('#pline');let t=setInterval(()=>{if(i)box.children[i-1]&&box.children[i-1].classList.remove('on');if(i>=logs.length){clearInterval(t);setTimeout(()=>go('personas'),700);return}box.insertAdjacentHTML('beforeend',`<div class="log on"><span>${logs[i]}</span><b>PROCESSING</b></div>`);line.style.width=((i+1)/logs.length*100)+'%';i++},620);kickValidation()}
async function kickValidation(){try{const res=await fetch(API+'/validations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:product.name,audience:product.audience,price:parseFloat((product.price||'').replace(/[^0-9.]/g,''))||29,category:product.category})});const r=await res.json();if(!r.id)return;run=r.id;const timer=setInterval(async()=>{try{const rr=await(await fetch(API+'/validations/'+run)).json();if(rr.status==='complete'&&rr.data){clearInterval(timer);pool=rr.data.personas.map(p=>[p.name,String(p.age),p.profession,String(p.purchaseProbability),p.income,p.behaviour,p.painPoint]);simPool=rr.data.simulation.map(m=>m.text);const live=document.querySelector('.live');if(live)live.innerHTML='<i></i> API ONLINE';if(current==='personas')root.innerHTML=pages.personas()}}catch{}},800)}catch{/* backend offline — static demo data used */}}
function startChat(){let chat=document.querySelector('#chat'),num=document.querySelector('#messages'),n=1284,items=simPool.length?simPool:['Competitor offers this already.','The dashboard looks unusually clear.','I need to know my data stays private.','This is exactly what my workflow lacks.'];setInterval(()=>{if(current!=='simulation')return;let d=document.createElement('div');d.className='msg';d.innerHTML=items[Math.floor(Math.random()*items.length)]+'<i>Live · '+(60+Math.floor(Math.random()*35))+'%</i>';chat.append(d);if(chat.children.length>5)chat.children[0].remove();num.textContent=++n},2500)}
document.querySelectorAll('.navbtn[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));go('workspace');
</script></body></html>
